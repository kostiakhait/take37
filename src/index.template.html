<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>TAKE 37 - the set</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161f; overflow: hidden; font: 14px/1.3 system-ui, sans-serif; color: #e8ecf5; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #hud { position: fixed; left: 8px; top: 8px; max-width: 46em; padding: 6px 8px; background: rgba(10,12,20,.55); border-radius: 6px; font: 12px ui-monospace, Consolas, monospace; white-space: pre-wrap; pointer-events: none; }
  body.clean #hud { display: none; }
  #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #14181c; transition: opacity .8s; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash h1 { margin: 0; font: 600 clamp(22px, 5vw, 40px)/1.1 Georgia, serif; letter-spacing: .24em; }
  #splash .track { width: min(420px, 70vw); height: 4px; background: rgba(255,255,255,.14); border-radius: 2px; overflow: hidden; }
  #splashbar { height: 100%; width: 3%; background: #d9a441; transition: width .25s ease; }
  #splashtxt { color: #c8d0d8; font-size: 13px; min-height: 1.3em; }
  #splashver { color: #78858f; font: 12px ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="hud"></div>
<div id="splash"><h1>TAKE 37</h1><div class="track"><div id="splashbar"></div></div><div id="splashtxt">Starting</div><div id="splashver"></div></div>
<!--SCRIPTS-->
<script>if (new URLSearchParams(location.search).get('clean') === '1') document.body.classList.add('clean');</script>
</body>
</html>
